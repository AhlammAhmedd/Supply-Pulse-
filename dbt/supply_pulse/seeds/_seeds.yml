

version: 2

seeds:
  - name: map_menu_section
    description: "Maps every raw menu_section spelling (lower-cased) to one standard label."
    columns:
      - name: raw_value
        data_tests:
          - unique      # one row per raw spelling, otherwise the join would duplicate menu items
          - not_null
      - name: clean_value
        data_tests:
          - not_null








  - name: map_product_category
    description: "Maps every raw product category spelling (lower-cased) to one standard label."
    columns:
      - name: raw_value
        data_tests:
          - unique
          - not_null
      - name: clean_value
        data_tests:
          - not_null