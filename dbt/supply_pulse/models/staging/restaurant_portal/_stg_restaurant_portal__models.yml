version: 2

models:
  - name: stg_restaurant_portal__menu_items

    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "item_name is null or item_name not in ('', 'null', 'NULL', 'N/A', 'nan', 'None', '-')"

      - dbt_utils.expression_is_true:
          arguments:
            expression: "item_name is null or item_name <> upper(item_name)"

    columns:
      - name: menu_item_id
        data_tests: [unique, not_null]

      - name: vendor_id
        data_tests: [not_null]

      - name: menu_section
        data_tests:
          - not_null

      - name: price_egp
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 1000

      - name: is_vegetarian
        data_tests: [not_null]